<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MyDiffuser Client{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 0.5em;
            color: #58a6ff;
        }
        h2 {
            font-size: 1.5em;
            margin-bottom: 0.5em;
            color: #58a6ff;
        }
        h3 {
            font-size: 1.2em;
            margin-bottom: 0.5em;
            color: #8b949e;
        }
        .nav {
            margin-bottom: 2em;
            padding-bottom: 1em;
            border-bottom: 1px solid #30363d;
        }
        .nav a {
            color: #58a6ff;
            text-decoration: none;
            margin-right: 1em;
        }
        .nav a:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 1.5em;
        }
        label {
            display: block;
            margin-bottom: 0.5em;
            font-weight: 600;
            color: #8b949e;
        }
        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2ea043;
        }
        button:active {
            background: #1f7a2e;
        }
        .info {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 1.5em;
            font-size: 14px;
            color: #8b949e;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        #status.success {
            background: #1a3d2a;
            border: 1px solid #238636;
            color: #3fb950;
            display: block;
        }
        #status.error {
            background: #4c1d1d;
            border: 1px solid #f85149;
            color: #f85149;
            display: block;
        }
        #status.progress {
            background: #1a3d5c;
            border: 1px solid #58a6ff;
            color: #58a6ff;
            display: block;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <div class="container">
        {% block navigation %}
        <div class="nav">
            <a href="/">Image</a>
            {% if VIDEO_ENABLED %}
            <a href="/generate/video">Video</a>
            {% endif %}
            <a href="/browse">Browse</a>
            <a href="/jobs">Jobs</a>
            <a href="/assist">Assistant</a>
            <a href="/health-dashboard">Health</a>
            <a href="/admin/performance">Performance</a>
        </div>
        {% endblock %}

        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
